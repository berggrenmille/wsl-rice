# Violet Afterdark. Keep tmux's familiar Ctrl-b prefix.
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-256color:RGB'
set -sg escape-time 10
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-interval 10
set -g status-style 'bg=#0D0914,fg=#9080A5'
set -g status-left-length 40
set -g status-left '#[fg=#0D0914,bg=#B56CFF,bold] ◆ #S #[default] '
set -g status-right-length 60
set -g status-right '#[fg=#9080A5]Ctrl-b F1: help #[fg=#67418C]│ #[fg=#B56CFF]%H:%M '
setw -g window-status-format '#[fg=#9080A5] #I:#W '
setw -g window-status-current-format '#[fg=#E06CDB,bg=#211332,bold] #I:#W #[default]'
set -g pane-border-style 'fg=#211332'
set -g pane-active-border-style 'fg=#B56CFF'
set -g message-style 'bg=#211332,fg=#DDD5E8'
set -g mode-style 'bg=#67418C,fg=#DDD5E8'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
# Swedish-layout shortcuts: the letter describes the divider's orientation.
bind v split-window -h -c '#{pane_current_path}'
bind h split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind r source-file ~/.tmux.conf \; display-message 'Violet Afterdark reloaded'
# Prefix first, then F1. Application F1 shortcuts remain available normally.
bind F1 display-menu -T 'Violet Afterdark — choose a shortcut' -x C -y C \
    'Vertical divider: side by side' v 'split-window -h -c "#{pane_current_path}"' \
    'Horizontal divider: top / bottom' h 'split-window -v -c "#{pane_current_path}"' \
    'Toggle current pane full-screen' z 'resize-pane -Z' \
    'Cycle pane arrangement' Space 'next-layout' \
    '' \
    'Overview: sessions, windows, panes' w 'choose-tree -Z' \
    'Show pane numbers' q 'display-panes' \
    'New window' c 'new-window -c "#{pane_current_path}"' \
    'Next window' n 'next-window' \
    'Previous window' p 'previous-window' \
    '' \
    'Detach (keep everything running)' d 'detach-client' \
    'Reload theme' r 'source-file ~/.tmux.conf'
